<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap');

  * { box-sizing: border-box; }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }

  .frame {
    position: relative;
    width: 500px;
    height: 500px;
    border: 1px dashed;
    background-color: #bbbbba;
  }
  
  .moka-pot {
    position: absolute;
    left: 20%;
    top: 30%;
    width: 20%;
    height: 40%;
    z-index: 3;
  }
  
  .pot-bottom {
    position: absolute;
    
    left: 10%;
    top: 70%;
    
    width: 80%;
    height: 30%;
    
    background-color: #CED3D6;
    clip-path: polygon(
      15% 0%,
      85% 0%,
      100% 100%,
      0% 100%
    );
  }
  
  .pot-middle {
    position: absolute;
    left: 22%;
    top: 62%;
    width: 56%;
    height: 10%;

    background: #E97625;
    border-radius: 12%;
  }
  
  .pot-top {
    position: absolute;
    left: 12%;
    top: 23%;
    width: 76%;
    height: 40%;

    background: #F28C38;
    clip-path: polygon(
      0% 0%,
      100% 0%,
      82% 100%,
      18% 100%
    );
  }
  
  .pot-spout {
    position: absolute;
    left: 78%;
    top: 24%;
    width: 20%;
    height: 23%;

    background: #E97625;
    clip-path: polygon(
      0% 0%,
      100% 0%,
      70% 35%,
      0% 100%
    );
  }
  
  .pot-lid {
    position: absolute;
    left: 8%;
    top: 19%;
    width: 84%;
    height: 6%;

    background: #FFAC58;
    border-radius: 50% 50% 12% 12%;
  }

  .pot-knob {
    position: absolute;
    left: 42%;
    top: 14%;
    width: 16%;
    height: 5%;

    background: #303033;
    clip-path: polygon(
      100% 100%,
      0% 100%,
      15% 0%,
      85% 0%
    );
  }
    

  .pot-handle-connector {
    position: absolute;
    left: 7%;
    top: 27%;
    width: 10%;
    height: 10%;

    background: #303033;
    border-radius: 3px;
  }


  .pot-handle {
    position: absolute;
    left: -20%;
    top: 30%;
    width: 30%;
    height: 25%;

    background: transparent;

    border-top: 10px solid #303033;
    border-left: 10px solid #303033;

    border-top-left-radius: 35px;
  }

    
  .coffee-can {
    position: absolute;
    background-color: #F9CF16;
    border-radius: 3% 3% 5% 5%;
  }

  /* Yellow lid */
  .can-lid {
    position: absolute;
    left: -2%;
    top: -3%;
    width: 104%;
    height: 7%;

    background-color: #FFD91F;
    border-radius: 50%;
    border-bottom: 3px solid #D9A90D;
  }

  /* Red bottom label */
  .can-bottom {
    position: absolute;
    left: 0;
    top: 75%;
    width: 100%;
    height: 25%;

    background-color: #E93E35;
    border-radius: 0 0 5% 5%;
  }

  .can-text {
    position: absolute;
    left: 5%;
    top: 15%;
    width: 90%;

    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 16px;
    line-height: 1.1;
    color: #253C68;
    text-align: center;
  }

  .can-left {
    left: 29%;
    top: 42%;
    width: 18%;
    height: 28%;
    z-index: 1;
  }

  .can-right {
    left: 43%;
    top: 41%;
    width: 21%;
    height: 29%;
    z-index: 2;
  }

  .espresso-cup {
    position: absolute;
    width: 9%;
    height: 8%;
    z-index: 4;
  }

  .cup-body {
    position: absolute;
    left: 15%;
    top: 0;
    width: 85%;
    height: 100%;

    background: repeating-linear-gradient(
      to bottom,
      #F5F0E6 0%,
      #F5F0E6 20%,
      #344E80 20%,
      #344E80 40%
    );

    border-radius: 12% 12% 15% 15%;
  }

  .cup-handle {
    position: absolute;
    left: -30%;
    top: 18%;
    width: 55%;
    height: 65%;

    background: transparent;

    border: 5px solid #F5F0E6;
    border-right: none;
    border-radius: 70% 0 0 70%;
    z-index: 3;
  }

  .cup-triangle {
    position: absolute;
    left: 15%;
    top: 25%;
    width: 45%;
    height: 50%;

    background: #D94C49;
    clip-path: polygon(
      0% 0%,
      100% 50%,
      0% 100%
    );
  }

  .cup-rim {
    position: absolute;
    left: 15%;
    top: -3%;
    width: 85%;
    height: 9%;

    background: #FFF9EF;
    border-radius: 50%;
  }

  .cup-top {
    left: 39%;
    bottom: 38%;
    z-index: 5;
  }

  .cup-bottom {
    left: 39%;
    bottom: 30%;
    z-index: 4;
  }

  /* Espresso cup on top of right coffee can */
  .cup-on-can {
    left: 49%;
    top: 31%;
    width: 9%;
    height: 10%;
    z-index: 5;
  }

  .cup-on-can .cup-handle {
    left: 42%;
    top: 20%;
    width: 22%;
    height: 60%;

    background: transparent;
    border: 5px solid #F5F0E6;
    border-radius: 50%;

    z-index: 3;
  }

  /* Mirrored red triangle on right side */
  .cup-on-can .cup-triangle {
    left: 55%;
    width: 45%;
    transform: scaleX(-1);
  }

  /* Slightly rounder body */
  .cup-on-can .cup-body {
    border-radius: 15% 15% 20% 20%;
  }

</style>


<div class="frame">
  <div class="moka-pot">
    <div class="pot-bottom"></div>
    <div class="pot-middle"></div>
    <div class="pot-top"></div>
    <div class="pot-spout"></div>
    <div class="pot-lid"></div>
    <div class="pot-knob"></div>
    <div class="pot-handle-connector"></div>
    <div class="pot-handle"></div>
  </div>
  
  <div class="coffee-can can-left">
    <div class="can-lid"></div>
    <div class="can-text">CAFÉ<br>BUSTELO</div>
    <div class="can-bottom"></div>
  </div>

  <div class="coffee-can can-right">
    <div class="can-lid"></div>
    <div class="can-text">CAFÉ<br>BUSTELO</div>
    <div class="can-bottom"></div>
  </div>
  
  <div class="espresso-cup cup-top">
    <div class="cup-handle"></div>
    <div class="cup-body"></div>
    <div class="cup-triangle"></div>
    <div class="cup-rim"></div>
  </div>

  <div class="espresso-cup cup-bottom">
    <div class="cup-handle"></div>
    <div class="cup-body"></div>
    <div class="cup-triangle"></div>
    <div class="cup-rim"></div>
  </div> 

  <div class="espresso-cup cup-on-can">
    <div class="cup-handle"></div>
    <div class="cup-body"></div>
    <div class="cup-triangle"></div>
    <div class="cup-rim"></div>
  </div>
</div>
